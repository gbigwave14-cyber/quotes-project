<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Случайная цитата</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f5fb;
    --card: #ffffff;
    --text: #1b2230;
    --muted: #5c6577;
    --accent: #3f6fe0;
    --border: rgba(27, 34, 48, 0.12);
    --danger: #c0392b;
    --shadow: 0 18px 44px -26px rgba(18, 28, 56, 0.45);
    --quote-min-h: 150px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e131e;
      --card: #171f2e;
      --text: #e7ecf7;
      --muted: #96a1b6;
      --accent: #6f96ff;
      --border: rgba(231, 236, 247, 0.14);
      --danger: #ff8a80;
      --shadow: 0 18px 44px -26px rgba(0, 0, 0, 0.85);
    }
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: stretch;
  }

  .card {
    display: inline;
    flex-direction: column;
    gap: 22px;
    padding: clamp(20px, 4vw, 40px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  .card__meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
  }

  .badge {
    max-width: 100%;
    overflow: hidden;
    padding: 5px 11px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-left: auto;
  }

  .counter {
    min-width: 4em;
    padding: 0 2px;
    color: var(--muted);
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .quote {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    min-height: var(--quote-min-h);
    margin: 0;
  }

  .quote__text {
    margin: 0;
    font-size: clamp(1.35rem, 3.6vw, 2rem);
    font-weight: 600;
    line-height: 1.36;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .quote__author {
    max-width: 26ch;
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 0.85rem;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 20px;
  }

  @keyframes quote-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .quote--enter { animation: quote-in 260ms ease-out; }

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: var(--quote-min-h);
    margin: 0;
    color: var(--muted);
    text-align: center;
  }

  .status {
    min-height: 1.3em;
    margin: 0;
    color: var(--muted);
    font-size: 0.88rem;
  }

  .status--error { color: var(--danger); }
  .status--ok { color: var(--accent); }

  .btn {
    appearance: none;
    padding: 12px 18px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
  }

  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: translateY(1px); }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn--icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border-color: var(--border);
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1;
  }

  .btn--icon:hover:not(:disabled),
  .btn--icon.is-ok { border-color: currentColor; }

  .btn--icon:hover:not(:disabled) { color: var(--text); }

  .btn--icon.is-ok { color: var(--accent); }

  .btn--icon svg {
    display: block;
    width: 16px;
    height: 16px;
  }

  .btn--ghost {
    border-color: var(--border);
    color: var(--muted);
  }

  .btn--ghost:hover:not(:disabled) { color: var(--text); }

  .btn--sm {
    padding: 9px 14px;
    font-size: 0.85rem;
  }

  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<main class="app">
  <article class="card">
    <div class="card__meta">
      <span class="badge" id="category" hidden></span>

      <div class="toolbar">
        <span class="quote__author" id="quoteAuthor" aria-live="polite" hidden></span>

        <button type="button" class="btn btn--icon" id="copy" aria-label="Скопировать цитату" title="Скопировать (C)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="12" height="12" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
    </div>

    <blockquote class="quote" id="quoteBox" aria-live="polite" hidden>
      <p class="quote__text" id="quoteText"></p>
    </blockquote>

    <p class="placeholder" id="placeholder">Загрузка цитат…</p>

    <p class="status" id="status" role="status"></p>

    <div class="nav">
      <button type="button" class="btn btn--icon" id="prev" aria-label="Предыдущая цитата" title="Предыдущая (←)" disabled>&#8249;</button>

      <span class="counter" id="counter" hidden></span>

      <button type="button" class="btn btn--icon" id="next" aria-label="Следующая цитата" title="Следующая (→)" disabled>&#8250;</button>

      <button type="button" class="btn btn--ghost btn--sm" id="retry" hidden>Повторить</button>
    </div>
  </article>

  <noscript><p class="hint">Для работы страницы нужен включённый JavaScript.</p></noscript>
</main>

<script>
(() => {
  'use strict';

  // Источник данных: https://github.com/gbigwave14-cyber/quotes-project
  // raw.githubusercontent.com отдаёт Access-Control-Allow-Origin: *, поэтому fetch работает
  // и при открытии страницы по file://
  const SOURCE_URL = 'https://raw.githubusercontent.com/gbigwave14-cyber/quotes-project/main/quotes-ru.json';
  const REQUEST_TIMEOUT_MS = 10000;
  const FEEDBACK_MS = 1500;

  // Из файла берутся только цитаты этих категорий (регистр не важен).
  // Пустой массив — без фильтра: показываются все корректные записи.
  const CATEGORIES = ['Мудрость', 'Мотивация', 'Работа'];

  // Набор цитат кэшируется на текущий календарный день: пока кэш свежий,
  // страница не обращается к сети вообще.
  const CACHE_KEY = 'quotes-cache-v1';

  const els = {
    category: document.getElementById('category'),
    counter: document.getElementById('counter'),
    quoteBox: document.getElementById('quoteBox'),
    quoteText: document.getElementById('quoteText'),
    quoteAuthor: document.getElementById('quoteAuthor'),
    placeholder: document.getElementById('placeholder'),
    status: document.getElementById('status'),
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
    copy: document.getElementById('copy'),
    retry: document.getElementById('retry')
  };

  const state = {
    quotes: [],
    deck: [],
    pos: 0,
    phase: 'idle' // idle | loading | ready | error
  };

  let statusTimer = 0;
  let copyTimer = 0;

  // --- данные -------------------------------------------------------------

  const isWanted = (category) =>
    CATEGORIES.length === 0 ||
    CATEGORIES.some((name) => name.toLowerCase() === category.toLowerCase());

  const normalize = (data) => {
    if (!Array.isArray(data)) {
      return [];
    }
    return data
      .filter((item) => item && typeof item.text === 'string' && item.text.trim() !== '')
      .map((item) => ({
        text: item.text.trim(),
        author: typeof item.author === 'string' && item.author.trim() !== ''
          ? item.author.trim()
          : 'Неизвестный автор',
        category: typeof item.category === 'string' ? item.category.trim() : ''
      }))
      .filter((quote) => isWanted(quote.category));
  };

  const shuffle = (list) => {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };

  const emptyMessage = () =>
    CATEGORIES.length
      ? 'В файле нет цитат в категориях: ' + CATEGORIES.join(', ')
      : 'В файле не найдено ни одной корректной цитаты';

  // --- кэш на день --------------------------------------------------------
  // Кэш необязателен: если localStorage недоступен (приватный режим, запрет
  // хранилища, битые данные), страница просто работает как раньше — с сетью.

  const todayKey = () => {
    const now = new Date();
    const pad = (value) => String(value).padStart(2, '0');
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  };

  const sameCategories = (cached) =>
    Array.isArray(cached) &&
    cached.length === CATEGORIES.length &&
    cached.every((name, index) => name === CATEGORIES[index]);

  const readCache = () => {
    try {
      const entry = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (!entry || entry.day !== todayKey()) return null;
      if (entry.url !== SOURCE_URL || !sameCategories(entry.categories)) return null;
      const quotes = normalize(entry.quotes);
      return quotes.length ? quotes : null;
    } catch (error) {
      return null;
    }
  };

  const writeCache = (quotes) => {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        day: todayKey(),
        url: SOURCE_URL,
        categories: CATEGORIES,
        quotes
      }));
    } catch (error) {
      // кэш — только оптимизация, ошибка записи ничего не ломает
    }
  };

  // --- загрузка -----------------------------------------------------------

  async function load() {
    if (state.phase === 'loading') {
      return;
    }

    state.phase = 'loading';
    state.quotes = [];
    state.deck = [];
    state.pos = 0;
    flash('');
    draw();

    const cached = readCache();
    if (cached) {
      apply(cached);
      flash('Цитат из кэша: ' + cached.length, 'ok');
      return;
    }

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    try {
      const response = await fetch(SOURCE_URL, { cache: 'no-cache', signal: controller.signal });
      if (!response.ok) {
        throw new Error('Сервер вернул код ' + response.status);
      }
      const quotes = normalize(await response.json());
      if (!quotes.length) {
        throw new Error(emptyMessage());
      }
      writeCache(quotes);
      apply(quotes);
      flash('Загружено цитат: ' + quotes.length, 'ok');
    } catch (error) {
      state.phase = 'error';
      draw();
      flash(describeError(error), 'error');
    } finally {
      clearTimeout(timer);
    }
  }

  function apply(quotes) {
    state.quotes = quotes;
    state.deck = shuffle(quotes);
    state.pos = 0;
    state.phase = 'ready';
    draw();
  }

  const describeError = (error) => {
    if (!error) {
      return 'Не удалось загрузить цитаты.';
    }
    if (error.name === 'AbortError') {
      return 'Источник не ответил за ' + (REQUEST_TIMEOUT_MS / 1000) + ' с. Попробуйте ещё раз.';
    }
    if (error instanceof TypeError) {
      return 'Не удалось загрузить цитаты. Проверьте подключение к интернету и нажмите «Повторить».';
    }
    return error.message || 'Не удалось загрузить цитаты.';
  };

  // --- отображение --------------------------------------------------------

  // Единственная точка, которая включает и выключает части интерфейса
  // по текущей фазе state.phase
  function draw() {
    const quote = state.phase === 'ready' ? state.deck[state.pos] : null;

    if (quote) {
      // live-регионы сначала показываем, потом наполняем:
      // текст, добавленный в скрытый элемент, часть AT не озвучивает
      els.quoteBox.hidden = false;
      els.quoteText.textContent = quote.text;

      els.quoteAuthor.hidden = false;
      els.quoteAuthor.textContent = '— ' + quote.author;
      els.quoteAuthor.title = quote.author;

      els.category.textContent = quote.category;
      els.category.hidden = !quote.category;

      els.counter.textContent = (state.pos + 1) + ' / ' + state.deck.length;
      els.counter.hidden = false;

      els.placeholder.hidden = true;
      els.copy.classList.remove('is-ok');

      // перезапуск анимации: снять класс, форсировать reflow, вернуть класс
      els.quoteBox.classList.remove('quote--enter');
      void els.quoteBox.offsetWidth;
      els.quoteBox.classList.add('quote--enter');
    } else {
      els.quoteBox.hidden = true;
      els.quoteText.textContent = '';

      els.quoteAuthor.textContent = '';
      els.quoteAuthor.title = '';
      els.quoteAuthor.hidden = true;

      els.category.textContent = '';
      els.category.hidden = true;

      els.counter.hidden = true;

      els.placeholder.textContent = state.phase === 'error' ? 'Цитаты недоступны' : 'Загрузка цитат…';
      els.placeholder.hidden = false;
    }

    els.prev.disabled = !quote || state.pos <= 0;
    els.next.disabled = !quote;
    els.copy.disabled = !quote;
    els.retry.hidden = state.phase !== 'error';
  }

  function flash(message, kind) {
    clearTimeout(statusTimer);
    els.status.textContent = message || '';
    els.status.className = 'status' + (kind ? ' status--' + kind : '');
    if (message && kind === 'ok') {
      statusTimer = setTimeout(() => {
        els.status.textContent = '';
        els.status.className = 'status';
      }, FEEDBACK_MS);
    }
  }

  // --- навигация ----------------------------------------------------------
  // Цитаты идут по перемешанной колоде: каждый проход показывает все цитаты по одному разу.
  // Когда колода закончилась, она перемешивается заново (без повтора текущей цитаты).

  function next() {
    if (state.phase !== 'ready') {
      return;
    }

    if (state.pos + 1 >= state.deck.length) {
      const current = state.deck[state.pos];
      state.deck = shuffle(state.quotes);
      if (state.deck.length > 1 && state.deck[0].text === current.text && state.deck[0].author === current.author) {
        const swapIndex = 1 + Math.floor(Math.random() * (state.deck.length - 1));
        [state.deck[0], state.deck[swapIndex]] = [state.deck[swapIndex], state.deck[0]];
      }
      state.pos = 0;
    } else {
      state.pos += 1;
    }

    draw();
  }

  function prev() {
    if (state.phase !== 'ready' || state.pos <= 0) {
      return;
    }
    state.pos -= 1;
    draw();
  }

  // --- копирование --------------------------------------------------------

  const legacyCopy = (text) => {
    const area = document.createElement('textarea');
    try {
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      return document.execCommand('copy');
    } catch (error) {
      return false;
    } finally {
      area.remove();
    }
  };

  // navigator.clipboard требует защищённого контекста, поэтому нужен запасной путь
  const writeClipboard = (text) =>
    navigator.clipboard?.writeText
      ? navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text))
      : Promise.resolve(legacyCopy(text));

  function copyCurrent() {
    const quote = state.phase === 'ready' ? state.deck[state.pos] : null;
    if (!quote) {
      return;
    }

    const payload = '«' + quote.text + '»\n— ' + quote.author +
      (quote.category ? ' (' + quote.category + ')' : '');

    writeClipboard(payload).then((copied) => {
      flash(copied ? 'Скопировано ✓' : 'Не удалось скопировать в буфер обмена', copied ? 'ok' : 'error');
      if (copied) {
        clearTimeout(copyTimer);
        els.copy.classList.add('is-ok');
        copyTimer = setTimeout(() => els.copy.classList.remove('is-ok'), FEEDBACK_MS);
      }
    });
  }

  // --- события ------------------------------------------------------------

  els.next.addEventListener('click', next);
  els.prev.addEventListener('click', prev);
  els.copy.addEventListener('click', copyCurrent);
  els.retry.addEventListener('click', load);

  document.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.repeat) {
      return;
    }

    // если фокус на кнопке — не мешаем её собственному действию
    const onButton = event.target && event.target.tagName === 'BUTTON';

    if (event.key === 'ArrowRight') {
      event.preventDefault();
      next();
      return;
    }

    if (event.key === 'ArrowLeft') {
      event.preventDefault();
      prev();
      return;
    }

    if (event.key === ' ' || event.key === 'Enter') {
      if (onButton) {
        return;
      }
      event.preventDefault();
      next();
      return;
    }

    // 'c' — латиница, 'с' — та же клавиша в русской раскладке
    const lower = event.key.toLowerCase();
    if (lower === 'c' || lower === 'с') {
      event.preventDefault();
      copyCurrent();
    }
  });

  draw();
  load();
})();
</script>
</body>
</html>
